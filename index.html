<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چت‌روم مخصوص رقیه و محمدحسین 🤍</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Vazirmatn,Tahoma,sans-serif}
body{background:linear-gradient(160deg,#1a1033,#3b1d5d 55%,#0f2027);min-height:100vh;color:#fff;padding:16px}
.wrap{max-width:560px;margin:auto}
header{text-align:center;padding:22px 10px}
header h1{font-size:26px;margin-bottom:6px}
header p{opacity:.75;font-size:14px}
.conn{font-size:12px;margin-top:8px;opacity:.85}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5b5b;margin-left:5px}
.dot.on{background:#4ade80}
.who{display:flex;gap:10px;margin:14px 0}
.who button{flex:1;padding:13px;border-radius:14px;border:2px solid transparent;background:#ffffff18;color:#fff;font-size:16px;cursor:pointer}
.who button.sel{border-color:#ff7eb3;background:#ff7eb322}
.who button:disabled{opacity:.35;cursor:not-allowed}
.cards{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.card{background:#ffffff14;border:1px solid #ffffff22;border-radius:16px;padding:14px}
.card h3{font-size:16px;margin-bottom:6px}
.card .st{font-size:19px;font-weight:bold;margin:4px 0}
.card .tx{font-size:14px;opacity:.9;margin:4px 0;line-height:1.9}
.card .tm{font-size:11px;opacity:.55}
.card.me{border-color:#ff7eb3}
.panel{background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;padding:14px;margin-top:6px}
.panel h3{font-size:15px;margin-bottom:10px}
.adminbox{border-color:#ffd166;background:#ffd16614}
.adminbox button{background:#ffd16622;border:1px solid #ffd166;color:#ffe3a3;border-radius:12px;padding:9px 14px;font-size:13px;cursor:pointer;margin:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#ffffff18;border:1px solid #ffffff25;color:#fff;border-radius:20px;padding:8px 13px;font-size:13px;cursor:pointer}
.chips button:hover{background:#ff7eb344}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;background:#00000040;border:1px solid #ffffff25;color:#fff;border-radius:12px;padding:11px;font-size:14px}
.row button{background:linear-gradient(135deg,#ff7eb3,#ff4d6d);border:none;color:#fff;border-radius:12px;padding:11px 18px;font-size:14px;cursor:pointer;font-weight:bold}
#gate{position:fixed;inset:0;background:#140b29f2;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.gatebox{background:#ffffff12;border:1px solid #ffffff2a;border-radius:18px;padding:26px 20px;max-width:340px;width:100%;text-align:center}
.gatebox h2{font-size:20px;margin-bottom:8px}
.gatebox p{font-size:13px;opacity:.75;margin-bottom:14px;line-height:2}
.gatebox input{width:100%;background:#00000050;border:1px solid #ffffff30;color:#fff;border-radius:12px;padding:12px;font-size:18px;text-align:center;letter-spacing:6px;margin-bottom:12px}
.gatebox button{width:100%;background:linear-gradient(135deg,#ff7eb3,#ff4d6d);border:none;color:#fff;border-radius:12px;padding:12px;font-size:15px;cursor:pointer;font-weight:bold}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding:4px}
.msg{max-width:85%;border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.9}
.msg.mine{align-self:flex-start;background:#ff7eb333;border:1px solid #ff7eb355}
.msg.theirs{align-self:flex-end;background:#ffffff14;border:1px solid #ffffff22}
.msg .nm{font-size:11px;opacity:.65;margin-bottom:2px}
.msg .tm{font-size:10px;opacity:.5;margin-top:2px}
footer{text-align:center;font-size:11px;opacity:.5;margin:22px 0 8px}
</style>
</head>
<body>
<div id="gate"><div class="gatebox">
<h2>🔒 ورود خصوصی</h2>
<p>این صفحه فقط مال محمدحسین و رقیه‌ست.<br>کد ورود رو بزن:</p>
<input id="gateInput" inputmode="numeric" maxlength="12" placeholder="••••">
<button onclick="checkGate()">ورود ✅</button>
</div></div>
<div class="wrap">
<header>
<h1>چت‌روم مخصوص رقیه و محمدحسین</h1>
<p>هر وقت خواستی چیزی به اون‌یکی بگی، اینجا بگو 💬</p>
<div class="conn"><span class="dot" id="dot"></span><span id="connTx">در حال اتصال…</span></div>
</header>
<div class="who">
<button id="btnM" onclick="iam('m')">🙋‍♂️ من محمدحسینم</button>
<button id="btnR" onclick="iam('r')">🙋‍♀️ من رقیه‌ام</button>
</div>
<div class="panel adminbox" id="adminBox" style="display:none">
<h3>👑 پنل مدیر (محمدحسین)</h3>
<div id="adminBtns"></div>
</div>
<div class="cards">
<div class="card" id="cardM"><h3>🙋‍♂️ محمدحسین</h3><div class="st" id="stM">…</div><div class="tx" id="txM"></div><div class="tm" id="tmM"></div></div>
<div class="card" id="cardR"><h3>🙋‍♀️ رقیه</h3><div class="st" id="stR">…</div><div class="tx" id="txR"></div><div class="tm" id="tmR"></div></div>
</div>
<div class="panel">
<h3>💬 حرف‌های اخیر <span id="typing" style="font-size:12px;opacity:.7"></span></h3>
<div class="chatlog" id="chatlog"></div>
</div>
<div class="panel">
<h3>📢 وضعیت من رو اعلام کن:</h3>
<div class="chips" id="chips"></div>
<div class="row"><input id="custom" oninput="typing()" placeholder="یا خودت بنویس… (مثلاً: نیم ساعت دیگه زنگ می‌زنم)"><button onclick="sendCustom()">ثبت ✅</button></div>
</div>
<footer>فقط مال ما دوتاست 🤍</footer>
</div>
<script>
const TOPIC="mhk-rog-yab-x7q2k9zm4p";
const GATE="1389";
const PRESETS=["💚 خوبم، پیام بده","🔕 الان پیام نده","🚶 بیرونم، برمی‌گردم","📚 سرم شلوغه","😴 استراحت می‌کنم","💬 بیا حرف بزنیم","❤️ دلم برات تنگ شده","🆘 مشکلی پیش اومده، زنگ بزن"];
let device=localStorage.getItem("yab_device")||"";
if(!device){device="d"+Math.random().toString(36).slice(2,10);localStorage.setItem("yab_device",device);}
let me=localStorage.getItem("yab_me")||"";
let locked=localStorage.getItem("yab_locked")==="1";
let claims={m:null,r:null};
function fa(n){return String(n).replace(/[0-9]/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);}
function ago(t){if(!t)return "";const s=Math.floor((Date.now()-t)/1000);if(s<60)return "لحظاتی پیش";if(s<3600)return fa(Math.floor(s/60))+" دقیقه پیش";if(s<86400)return fa(Math.floor(s/3600))+" ساعت پیش";return fa(Math.floor(s/86400))+" روز پیش";}
function checkGate(){let v=document.getElementById("gateInput").value.trim().replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));if(v===GATE){sessionStorage.setItem("yab_ok","1");document.getElementById("gate").style.display="none";}else{alert("کد اشتباهه 🔒");}}
if(sessionStorage.getItem("yab_ok")==="1"){document.getElementById("gate").style.display="none";}
async function pub(o){o.at=Date.now();await fetch("https://ntfy.sh/"+TOPIC,{method:"PUT",body:JSON.stringify(o)});}
function iam(w){
if(locked){alert("هویتت قفل شده 🔒 تو "+(me==="m"?"محمدحسین":"رقیه")+" هستی");return;}
if(claims[w]&&claims[w].device!==device){alert("این اسم قبلاً گرفته شده 🔒 فقط صاحبش می‌تونه استفاده کنه");return;}
me=w;locked=true;localStorage.setItem("yab_me",w);localStorage.setItem("yab_locked","1");
claims[w]={device:device,at:Date.now()};
pub({type:"claim",who:w,device:device});
paintWho();
}
async function release(w){if(me!=="m")return;claims[w]=null;await pub({type:"release",who:w});paintWho();}
function isAdmin(){return me==="m"&&locked;}
function paintWho(){
document.getElementById("btnM").classList.toggle("sel",me==="m");
document.getElementById("btnR").classList.toggle("sel",me==="r");
document.getElementById("cardM").classList.toggle("me",me==="m");
document.getElementById("cardR").classList.toggle("me",me==="r");
const tm=claims.m&&claims.m.device!==device&&me!=="m";
const tr=claims.r&&claims.r.device!==device&&me!=="r";
document.getElementById("btnM").disabled=!!tm;
document.getElementById("btnR").disabled=!!tr;
if(tm)document.getElementById("btnM").textContent="🔒 محمدحسین (گرفته شده)";
if(tr)document.getElementById("btnR").textContent="🔒 رقیه (گرفته شده)";
const ab=document.getElementById("adminBox");
if(isAdmin()){ab.style.display="block";
let h="";
h+="<div>محمدحسین: "+(claims.m?"گرفته شده ✅":"آزاد")+"</div>";
h+="<div>رقیه: "+(claims.r?"گرفته شده ✅":"آزاد")+"</div>";
if(claims.m)h+='<button onclick="release(\'m\')">آزاد کردن محمدحسین</button>';
if(claims.r)h+='<button onclick="release(\'r\')">آزاد کردن رقیه</button>';
document.getElementById("adminBtns").innerHTML=h;
}else{ab.style.display="none";}
}
function render(w,d){const W=w==="m"?"M":"R";document.getElementById("st"+W).textContent=d.status||"—";document.getElementById("tx"+W).textContent=d.note||"";document.getElementById("tm"+W).textContent=d.at?ago(d.at):"";}
let log=[];let lastType=0;let unread=0;let typeTimer=null;
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0.08;o.start();o.stop(c.currentTime+0.25);}catch(e){}}
function addLog(d,silent){if(!d.status&&!d.note)return;log.push(d);if(log.length>30)log.shift();renderLog();if(!silent&&d.who!==me){beep();unread++;document.title="("+fa(unread)+") چت‌روم 🤍";}}
function renderLog(){const el=document.getElementById("chatlog");if(!el)return;el.innerHTML=log.map(d=>{const mine=d.who===me;const nm=d.who==="m"?"🙋‍♂️ محمدحسین":"🙋‍♀️ رقیه";return '<div class="msg '+(mine?"mine":"theirs")+'"><div class="nm">'+nm+'</div><div class="bd">'+(d.status||"")+(d.note?"<br>"+d.note:"")+'</div><div class="tm">'+(d.at?ago(d.at):"")+'</div></div>';}).join("");el.scrollTop=el.scrollHeight;}
function typing(){if(!me)return;const n=Date.now();if(n-lastType<3000)return;lastType=n;pub({type:"typing",who:me,device:device});}
function showTyping(m){if(m.device===device||m.who===me)return;const nm=m.who==="m"?"محمدحسین":"رقیه";const el=document.getElementById("typing");if(!el)return;el.textContent="✍️ "+nm+" در حال نوشتن است…";clearTimeout(typeTimer);typeTimer=setTimeout(()=>{el.textContent="";},4000);}
document.addEventListener("click",()=>{unread=0;document.title="چت‌روم مخصوص رقیه و محمدحسین";});
async function publish(status,note){if(!me){alert("اول بگو کی هستی 👆");return;}
await pub({who:me,device:device,status:status,note:note||""});
document.getElementById("custom").value="";}
function sendCustom(){const v=document.getElementById("custom").value.trim();if(!v)return;publish("✏️ پیام",v);}
document.getElementById("chips").innerHTML=PRESETS.map(p=>`<button onclick='publish(${JSON.stringify(p)})'>${p}</button>`).join("");
function doReset(at){const k="yab_reset_seen";if(localStorage.getItem(k)===String(at))return;localStorage.setItem(k,String(at));localStorage.removeItem("yab_me");localStorage.removeItem("yab_locked");location.reload();}
async function loadHist(){try{const r=await fetch("https://ntfy.sh/"+TOPIC+"/json?poll=1");const t=await r.text();t.trim().split("\n").forEach(l=>{try{const j=JSON.parse(l);if(!j.message)return;const d=JSON.parse(j.message);
if(d.type==="reset"){doReset(d.at);}
else if(d.type==="claim"&&(d.who==="m"||d.who==="r")){claims[d.who]={device:d.device,at:d.at};}
else if(d.type==="release"&&(d.who==="m"||d.who==="r")){claims[d.who]=null;}
else if(d.who==="m"||d.who==="r"){render(d.who,d);addLog(d,true);}
}catch(e){}});
if(me&&!claims[me]){claims[me]={device:device,at:Date.now()};pub({type:"claim",who:me,device:device});}
paintWho();}catch(e){}}
function live(){try{const es=new EventSource("https://ntfy.sh/"+TOPIC+"/sse");es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event!=="message"||!d.message)return;const m=JSON.parse(d.message);
if(m.type==="claim"&&(m.who==="m"||m.who==="r")){claims[m.who]={device:m.device,at:m.at};paintWho();}
else if(m.type==="release"&&(m.who==="m"||m.who==="r")){claims[m.who]=null;paintWho();}
else if(m.type==="reset"){doReset(m.at);}
else if(m.type==="typing"){showTyping(m);}
else if(m.who==="m"||m.who==="r"){render(m.who,m);addLog(m,false);}
}catch(_){}};es.onopen=()=>{document.getElementById("dot").classList.add("on");document.getElementById("connTx").textContent="متصلیم 💚";};es.onerror=()=>{document.getElementById("dot").classList.remove("on");document.getElementById("connTx").textContent="در حال اتصال…";};}catch(e){setInterval(loadHist,15000);}}
paintWho();loadHist();live();setInterval(loadHist,60000);
</script>
</body>
</html>
